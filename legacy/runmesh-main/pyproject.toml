[project]
name = "runmesh"
version = "0.1.0"
description = "Task execution API for webhooks, queues, and scheduled jobs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "markupsafe",
    "jinja2",
    "python-multipart>=0.0.32",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "uvicorn>=0.32.0",
]


[dependency-groups]
dev = ["workers-py", "workers-runtime-sdk"]
